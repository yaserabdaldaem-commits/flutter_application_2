name: damascus_dehan_app
description: "تطبيق توقيت الدهان لمدينة دمشق - بإشراف المهندس ياسر"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- المكتبات الأساسية الواجهة والاتصال ---
  http: ^1.1.0
  audioplayers: ^5.2.1
  share_plus: ^7.1.0
  qr_flutter: ^4.1.0
  intl: ^0.18.1
  url_launcher: ^6.2.5
  cupertino_icons: ^1.0.2
  
  # --- ميزة التخزين المحلي للأوفلاين ---
  shared_preferences: ^2.2.2

  # --- خدمات الفايربيس (إصدارات متوافقة) ---
  firebase_core: ^4.5.0
  cloud_firestore: ^6.1.3
  firebase_remote_config: ^6.1.4
  
  # --- إدارة المنبهات والعمل في الخلفية ---
  android_alarm_manager_plus: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  # --- تعريف الخطوط والصور والملفات الصوتية ---
  assets:
    - assets/adhan.mp3